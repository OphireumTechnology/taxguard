name: Deploy TaxGuard Production to GitHub Pages

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: taxguard-production-pages
  cancel-in-progress: true

jobs:
  build:
    name: Build and Validate Production
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Show build environment
        run: |
          echo "TaxGuard Production Build"
          node --version
          npm --version

      - name: Install application dependencies
        run: npm install

      - name: Type check
        run: npm run typecheck

      - name: Run regression tests
        run: npm test -- --run

      - name: Verify required production variables
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
          VITE_PASSWORD_RESET_CONTINUE_URL: ${{ vars.VITE_PASSWORD_RESET_CONTINUE_URL }}
        run: |
          test -n "$VITE_API_BASE_URL" || {
            echo "ERROR: VITE_API_BASE_URL is missing."
            exit 1
          }

          test -n "$VITE_SUPABASE_URL" || {
            echo "ERROR: VITE_SUPABASE_URL is missing."
            exit 1
          }

          test -n "$VITE_SUPABASE_ANON_KEY" || {
            echo "ERROR: VITE_SUPABASE_ANON_KEY is missing."
            exit 1
          }

          test -n "$VITE_PASSWORD_RESET_CONTINUE_URL" || {
            echo "ERROR: VITE_PASSWORD_RESET_CONTINUE_URL is missing."
            exit 1
          }

          echo "Required production frontend variables are configured."

      - name: Build TaxGuard production application
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
          VITE_PASSWORD_RESET_CONTINUE_URL: ${{ vars.VITE_PASSWORD_RESET_CONTINUE_URL }}
        run: |
          npx tsx scripts/verify-production-config.ts
          npm run build

      - name: Verify production build
        run: |
          test -f dist/index.html || {
            echo "ERROR: dist/index.html was not generated."
            exit 1
          }

          if find dist -type f \( -name '*.cjs' -o -name '*.map' \) -print | grep -q .; then
            echo "ERROR: Server or source-map artifacts detected in public deployment."
            exit 1
          fi

          echo "artaxserv.com" > dist/CNAME

          test "$(cat dist/CNAME)" = "artaxserv.com" || {
            echo "ERROR: Production CNAME is incorrect."
            exit 1
          }

          echo "TaxGuard production build verified."

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload production artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    name: Deploy Production
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy TaxGuard to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
