name: Deploy TaxGuard Production to GitHub Pages

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: taxguard-production-pages
  cancel-in-progress: false

jobs:
  build:
    name: Validate and Build Production
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Require main branch
        shell: bash
        run: |
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "::error::Production deployment is restricted to main."
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Show build environment
        run: |
          echo "TaxGuard Production Build"
          node --version
          npm --version

      - name: Install locked dependencies
        run: npm ci --include=dev --include=optional

      - name: Type check
        run: npm run typecheck

      - name: Run regression tests
        run: npm test -- --run

      - name: Verify production configuration
        shell: bash
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
          VITE_PASSWORD_RESET_CONTINUE_URL: ${{ vars.VITE_PASSWORD_RESET_CONTINUE_URL }}
        run: |
          set -euo pipefail

          for name in \
            VITE_API_BASE_URL \
            VITE_SUPABASE_URL \
            VITE_SUPABASE_ANON_KEY \
            VITE_PASSWORD_RESET_CONTINUE_URL
          do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::$name is missing."
              exit 1
            fi
          done

          node - <<'NODE'
          const names = [
            "VITE_API_BASE_URL",
            "VITE_SUPABASE_URL",
            "VITE_PASSWORD_RESET_CONTINUE_URL"
          ];

          for (const name of names) {
            const value = process.env[name];
            let url;

            try {
              url = new URL(value);
            } catch {
              throw new Error(`${name} must be a valid URL.`);
            }

            if (url.protocol !== "https:") {
              throw new Error(`${name} must use HTTPS.`);
            }

            if (url.username || url.password || url.hash) {
              throw new Error(`${name} contains unsupported URL components.`);
            }
          }

          console.log("Production URLs validated.");
          NODE

      - name: Build TaxGuard production application
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
          VITE_PASSWORD_RESET_CONTINUE_URL: ${{ vars.VITE_PASSWORD_RESET_CONTINUE_URL }}
        run: |
          npx --no-install tsx scripts/verify-production-config.ts
          npm run build

      - name: Verify production artifact
        shell: bash
        run: |
          set -euo pipefail

          test -f dist/index.html || {
            echo "::error::Missing dist/index.html."
            exit 1
          }

          if find dist -type f \
            \( -name '*.cjs' -o -name '*.map' \) \
            -print -quit | grep -q .; then
            echo "::error::Server or source-map artifacts detected."
            exit 1
          fi

          if find dist -type f \
            \( -name '.env' -o -name '.env.*' -o -name '*.pem' -o -name '*.key' \) \
            -print -quit | grep -q .; then
            echo "::error::Potential sensitive file in artifact."
            exit 1
          fi

          printf '%s\n' 'artaxserv.com' > dist/CNAME

          test "$(cat dist/CNAME)" = "artaxserv.com"

          echo "Production artifact verified."

      - name: Upload production artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    name: Deploy Approved Production Build
    runs-on: ubuntu-latest
    needs: build

    permissions:
      contents: read
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy TaxGuard to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
