name: Deploy TaxGuard Production to GitHub Pages

# Manual-only production deployment. CI on main NEVER triggers this workflow.
# A human must explicitly dispatch it with a full commit SHA on main, and that exact
# SHA must have passed the Development CI push workflow. Environment reviewers are
# recommended as an additional approval gate.
#   * The build repeats type checking, tests and the branding checks, stamps cache-busting asset versions with the
#     commit, writes CNAME (destriataxservices.com) and dist/version.json (the exact published commit), and refuses
#     server bundles, source maps and secret-like files in the artifact.
on:
  workflow_dispatch:
    inputs:
      commit:
        description: 'Exact 40-character commit SHA on main that passed TaxGuard Development CI'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: taxguard-production-pages
  cancel-in-progress: false

env:
  PAGES_DOMAIN: destriataxservices.com

jobs:
  resolve:
    name: Resolve the validated release commit
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      sha: ${{ steps.sha.outputs.sha }}
      deploy: ${{ steps.sha.outputs.deploy }}
      ci_run: ${{ steps.ci.outputs.run_id }}
    steps:
      - name: Require the main branch for manual runs
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "::error::Production deployment is dispatched from main only."
            exit 1
          fi

      - name: Determine the exact commit
        id: sha
        shell: bash
        env:
          INPUT_SHA: ${{ inputs.commit }}
        run: |
          set -euo pipefail
          SHA="$INPUT_SHA"
          if [[ ! "$SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::A full 40-character lowercase commit SHA is required."
            exit 1
          fi
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

      - name: Check out main history
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Require the commit to be on main
        shell: bash
        env:
          SHA: ${{ steps.sha.outputs.sha }}
        run: |
          set -euo pipefail
          git cat-file -e "$SHA^{commit}" || { echo "::error::Commit $SHA is not in this repository."; exit 1; }
          git merge-base --is-ancestor "$SHA" origin/main || { echo "::error::Commit $SHA is not on main."; exit 1; }

      - name: Require a successful Development CI run for the exact commit
        id: ci
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.sha.outputs.sha }}
        run: |
          set -euo pipefail
          run_id=$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/taxguard-development-ci.yml/runs?head_sha=${SHA}&event=push&status=success&per_page=1" --jq '.workflow_runs[0].id // empty')
          if [[ ! "${run_id:-}" =~ ^[0-9]+$ ]]; then
            echo "::error::No successful TaxGuard Development CI push run exists for $SHA. Validation must pass before deployment."
            exit 1
          fi
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          echo "Development CI run $run_id succeeded for $SHA."

  build:
    name: Validate and build the exact commit
    runs-on: ubuntu-latest
    needs: resolve
    permissions:
      contents: read
    steps:
      - name: Check out the exact validated commit
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          persist-credentials: false

      - name: Confirm the checked-out commit
        shell: bash
        env:
          SHA: ${{ needs.resolve.outputs.sha }}
        run: test "$(git rev-parse HEAD)" = "$SHA"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install locked dependencies
        run: npm ci --include=dev --include=optional

      - name: Type check
        run: npm run typecheck

      - name: Run regression tests
        run: npm test -- --run

      - name: Verify branding
        run: node scripts/verify-branding.mjs

      - name: Verify production configuration
        shell: bash
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
          VITE_PASSWORD_RESET_CONTINUE_URL: ${{ vars.VITE_PASSWORD_RESET_CONTINUE_URL }}
        run: |
          set -euo pipefail
          for name in VITE_API_BASE_URL VITE_SUPABASE_URL VITE_SUPABASE_ANON_KEY VITE_PASSWORD_RESET_CONTINUE_URL; do
            if [[ -z "${!name:-}" ]]; then echo "::error::$name is missing."; exit 1; fi
          done
          node - <<'NODE'
          for (const name of ['VITE_API_BASE_URL', 'VITE_SUPABASE_URL', 'VITE_PASSWORD_RESET_CONTINUE_URL']) {
            let url;
            try { url = new URL(process.env[name]); } catch { throw new Error(`${name} must be a valid URL.`); }
            if (url.protocol !== 'https:') throw new Error(`${name} must use HTTPS.`);
            if (url.username || url.password || url.hash) throw new Error(`${name} contains unsupported URL components.`);
          }
          console.log('Production URLs validated.');
          NODE

      - name: Build the production site
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
          VITE_PASSWORD_RESET_CONTINUE_URL: ${{ vars.VITE_PASSWORD_RESET_CONTINUE_URL }}
        run: |
          npx --no-install tsx scripts/verify-production-config.ts
          npm run build

      - name: Stamp release (cache busting, CNAME, version record)
        env:
          SHA: ${{ needs.resolve.outputs.sha }}
          TAXGUARD_VALIDATION_RUN: ${{ needs.resolve.outputs.ci_run }}
          TAXGUARD_BUILD_CHECKS: typecheck,regression tests,branding,production configuration,production build
        run: node scripts/stamp-release.mjs --commit "$SHA" --domain "$PAGES_DOMAIN" --dist dist

      - name: Verify production artifact
        shell: bash
        env:
          SHA: ${{ needs.resolve.outputs.sha }}
        run: |
          set -euo pipefail
          test -f dist/index.html || { echo "::error::Missing dist/index.html."; exit 1; }
          if find dist -type f \( -name '*.cjs' -o -name '*.map' \) -print -quit | grep -q .; then
            echo "::error::Server or source-map artifacts detected."; exit 1
          fi
          if find dist -type f \( -name '.env' -o -name '.env.*' -o -name '*.pem' -o -name '*.key' \) -print -quit | grep -q .; then
            echo "::error::Potential sensitive file in artifact."; exit 1
          fi
          test "$(cat dist/CNAME)" = "$PAGES_DOMAIN" || { echo "::error::CNAME must be $PAGES_DOMAIN."; exit 1; }
          node -e "const v=require('./dist/version.json'); if (v.commit !== process.env.SHA) { console.error('::error::version.json does not record the built commit.'); process.exit(1); }"
          {
            echo "### TaxGuard production release candidate"
            echo ""
            echo "| Field | Value |"
            echo "|---|---|"
            echo "| Commit | \`$SHA\` |"
            echo "| Domain | $PAGES_DOMAIN |"
            echo "| Brand asset version | $(node -p "require('./dist/version.json').brandAssetVersion") |"
            echo "| Trigger | Manual workflow_dispatch only |"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "Production artifact verified for $SHA."

      - name: Upload production artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    name: Deploy the manually approved production build
    runs-on: ubuntu-latest
    needs: [resolve, build]
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      previous: ${{ steps.previous.outputs.commit }}
    steps:
      # The release currently live, read from its version.json, is the rollback target if this one fails verification.
      - name: Record the current production release
        id: previous
        shell: bash
        run: |
          set -uo pipefail
          prev=$(curl -fsS --max-time 20 "https://${PAGES_DOMAIN}/version.json?previous=${GITHUB_RUN_ID}" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{try{const c=JSON.parse(s).commit;process.stdout.write(/^[0-9a-f]{40}$/.test(c)?c:'')}catch{}})" || true)
          echo "commit=$prev" >> "$GITHUB_OUTPUT"
          echo "Current production release: ${prev:-none recorded (pre-pipeline release)}"

      - name: Deploy TaxGuard to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Record the published commit
        shell: bash
        env:
          SHA: ${{ needs.resolve.outputs.sha }}
          URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          echo "### Published to production" >> "$GITHUB_STEP_SUMMARY"
          echo "Commit \`$SHA\` is live at $URL (record: ${URL%/}/version.json)." >> "$GITHUB_STEP_SUMMARY"

  verify:
    name: Verify the live website
    runs-on: ubuntu-latest
    needs: [resolve, deploy]
    permissions:
      contents: read
      actions: write
      issues: write
    steps:
      - name: Check the published release on destriataxservices.com
        id: live
        shell: bash
        env:
          SHA: ${{ needs.resolve.outputs.sha }}
        run: |
          set -uo pipefail
          # GitHub Pages caches for up to about ten minutes; poll for up to fifteen.
          for attempt in $(seq 1 30); do
            record=$(curl -fsS --max-time 20 "https://${PAGES_DOMAIN}/version.json?verify=${GITHUB_RUN_ID}-${attempt}" || true)
            page=$(curl -fsS --max-time 20 "https://${PAGES_DOMAIN}/?verify=${GITHUB_RUN_ID}-${attempt}" || true)
            if node -e "
              const r = JSON.parse(process.argv[1] || '{}'); const page = process.argv[2] || '';
              const ok = r.commit === process.env.SHA && r.customDomain === process.env.PAGES_DOMAIN && typeof r.brandAssetVersion === 'string'
                && page.includes('v=' + r.brandAssetVersion) && page.includes('<div id=\"root\"');
              process.exit(ok ? 0 : 1);" "$record" "$page" 2>/dev/null; then
              echo "Live: https://${PAGES_DOMAIN}/ serves $SHA with stamped brand assets."
              echo "verified=true" >> "$GITHUB_OUTPUT"; exit 0
            fi
            sleep 30
          done
          echo "::error::https://${PAGES_DOMAIN}/ did not serve $SHA with its stamped brand assets within fifteen minutes."
          echo "verified=false" >> "$GITHUB_OUTPUT"
          exit 1

      # Notify the owner on failed live verification. Rollback is manual-only:
      # an operator must separately approve and dispatch the prior validated SHA.
      - name: Report failed release and require manual rollback approval
        if: failure() && steps.live.outputs.verified == 'false'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ needs.resolve.outputs.sha }}
          PREVIOUS: ${{ needs.deploy.outputs.previous }}
        run: |
          set -euo pipefail
          if [[ "$PREVIOUS" =~ ^[0-9a-f]{40}$ && "$PREVIOUS" != "$SHA" ]]; then
            action="Manual rollback candidate: $PREVIOUS. Owner approval and a separate workflow dispatch are required."
          else
            action="No previous pipeline release is recorded; restore manually (multi-agent-integration.md, Rollback)."
          fi
          gh issue create --repo "$GITHUB_REPOSITORY" --title "Production verification failed for $SHA"             --body "The release $SHA failed live verification on https://${PAGES_DOMAIN}/ (run ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}). $action Investigate before releasing again." || true
          echo "$action"
