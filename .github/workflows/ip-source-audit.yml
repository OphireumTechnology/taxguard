name: TaxGuard IP Source Audit

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'scripts/**'
      - 'supabase/**'
      - 'server.ts'
      - 'index.html'
      - 'IP-PROTECTION/**'
      - 'scripts/ip-audit/**'
      - '.github/workflows/ip-source-audit.yml'

permissions:
  contents: read

concurrency:
  group: taxguard-ip-audit-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  read-only-source-audit:
    name: Read-only source attribution inventory
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Scan tracked source files without modifying them
        run: node scripts/ip-audit/scan-source-ownership.mjs --output ip-audit-report.json
      - name: Publish audit report
        uses: actions/upload-artifact@v4
        with:
          name: taxguard-ip-source-audit
          path: ip-audit-report.json
          if-no-files-found: error
          retention-days: 90
