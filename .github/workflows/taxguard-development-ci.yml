name: TaxGuard Development CI

on:
  pull_request:
    branches:
      - main
      - 'integration/**'
      - 'rc/**'
      - codex/taxguard-phase10-staging-readiness
    paths:
      - 'src/**'
      - 'tests/**'
      - 'tools/**'
      - 'scripts/**'
      - 'qa/**'
      - 'supabase/**'
      - 'docs/proposed-migrations/**'
      - 'docs/development/**'
      - 'package.json'
      - 'package-lock.json'
      - 'public/**'
      - 'index.html'
      - 'vite.config.ts'
      - 'tsconfig.json'
      - 'CNAME'
      - '.github/workflows/deploy-pages.yml'
      - '.github/workflows/taxguard-development-ci.yml'
  push:
    branches:
      # Every commit that reaches main (Google AI Studio sync, merged pull request or a direct push) is validated
      # exactly as pushed, with no path filter. Only a successful run for a push to main can feed the production
      # build (deploy-pages.yml), so a failed validation prevents deployment.
      - main
      # Validate every development sync branch exactly as pushed. Pull-request runs
      # test the merge with main, which can fail because of main alone.
      - 'sync/**'
      # Multi-agent branches (docs/development/multi-agent-integration.md): Google AI Studio, Claude Code, ChatGPT,
      # the unified integration branch and release candidates. None of these can deploy.
      - 'aistudio/**'
      - 'claude/**'
      - 'chatgpt/**'
      - 'integration/**'
      - 'rc/**'
      - 'codex/taxguard-phase11-completion'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: taxguard-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validation:
    name: Build and test (synthetic data only)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      CI: 'true'
      NODE_ENV: test

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          # Full history: the integration guard compares the update with its base commit.
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install locked dependencies
        run: npm ci --include=dev --include=optional

      - name: Check patch formatting
        run: git diff --check HEAD~1 HEAD

      # Rejects changes to existing migrations, unapproved deletions of protected source, and service clients or
      # routes that stop calling the API or database (replacement by local mocks). See multi-agent-integration.md.
      - name: Integration guard (protected source, migrations, real services)
        env:
          GUARD_BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: node scripts/integration-guard.mjs --base "$GUARD_BASE" --head HEAD

      - name: Lint
        run: npm run lint
      - name: TypeScript validation
        run: npm run typecheck
      - name: Build
        run: npm run build

      - name: Automated tests
        run: npm run test -- --run
      - name: Branding integrity
        run: node scripts/verify-branding.mjs
      - name: Offline migration and readiness integrity
        run: |
          node scripts/staging/migration-manifest.mjs
          node scripts/staging/migration-review-bundle.mjs
          npm run staging:migration:release-candidate
          npm run staging:recovery:local
          node scripts/staging/remaining-work.mjs
          npx --no-install tsx scripts/staging/phase11-ai-readiness.ts
          node scripts/verify-local-traceability.mjs
          node scripts/staging/scan-secrets.mjs
      - name: Disposable loopback PostgreSQL integration
        run: npm run test:db
