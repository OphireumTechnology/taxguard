name: TaxGuard Development CI

on:
  pull_request:
    branches:
      - main
      - codex/taxguard-phase10-staging-readiness
  push:
    branches:
      # Validate direct AI Studio main pushes and all supported sync branches.
      # Pull-request runs validate proposed changes before approval.
      - main
      - 'sync/**'
      - 'aistudio/**'
      - 'ai-studio/**'
      - 'codex/taxguard-phase11-completion'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: taxguard-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validation:
    name: Build and test (synthetic data only)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      CI: 'true'
      NODE_ENV: test

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 2

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install locked dependencies
        run: npm ci --include=dev --include=optional

      - name: Check patch formatting
        shell: bash
        run: |
          if git rev-parse --verify HEAD^ >/dev/null 2>&1; then
            git diff --check HEAD^ HEAD
          else
            git diff --check HEAD
          fi

      - name: Lint
        run: npm run lint
      - name: TypeScript validation
        run: npm run typecheck
      - name: Build
        run: npm run build

      - name: Automated tests
        run: npm run test -- --run
      - name: Offline migration and readiness integrity
        run: |
          node scripts/staging/migration-manifest.mjs
          node scripts/staging/migration-review-bundle.mjs
          npm run staging:migration:release-candidate
          npm run staging:recovery:local
          node scripts/staging/remaining-work.mjs
          npx --no-install tsx scripts/staging/phase11-ai-readiness.ts
          node scripts/verify-local-traceability.mjs
          node scripts/staging/scan-secrets.mjs
      - name: Disposable loopback PostgreSQL integration
        run: npm run test:db
