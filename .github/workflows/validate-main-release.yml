name: Validate latest TaxGuard main before production cutover

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/validate-main-release.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-current-source:
    name: Validate current source (no deployment)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR source, not pinned recovery snapshot
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci --include=dev --include=optional
      - name: Lint full source
        run: npm run lint
      - name: Typecheck full source
        run: npm run typecheck
      - name: Run regression tests
        run: npm test -- --run
      - name: Build current source
        run: npm run build
